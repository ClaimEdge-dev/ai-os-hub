name: DEBO Durable Save Gate
on:
  push:
    paths:
      - "tools/debo_durable_save_gate.py"
      - "tools/debo_verify_all.py"
      - "tests/test_debo_verification.py"
      - ".github/workflows/debo-durable-save-gate.yml"
  pull_request:
    paths:
      - "tools/debo_durable_save_gate.py"
      - "tools/debo_verify_all.py"
      - "tests/test_debo_verification.py"
      - ".github/workflows/debo-durable-save-gate.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Seven fail-closed regression tests
        run: python tests/test_debo_verification.py
