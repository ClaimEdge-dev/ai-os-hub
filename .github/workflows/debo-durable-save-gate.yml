name: DEBO Durable Save Gate
on:
  push:
    paths:
      - "tools/debo_durable_save_gate.py"
      - "tools/debo_verify_all.py"
      - "tests/test_debo_verification.py"
      - "tests/test_debo_registry_audit.py"
      - "tools/debo_registry_audit.py"
      - "schemas/debo_skill_inventory.schema.json"
      - ".github/workflows/debo-durable-save-gate.yml"
  pull_request:
    paths:
      - "tools/debo_durable_save_gate.py"
      - "tools/debo_verify_all.py"
      - "tests/test_debo_verification.py"
      - "tests/test_debo_registry_audit.py"
      - "tools/debo_registry_audit.py"
      - "schemas/debo_skill_inventory.schema.json"
      - ".github/workflows/debo-durable-save-gate.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: DEBO verification and registry regression tests
        run: python -m unittest discover -s tests -p "test_debo*.py" -v
