name: DEBO Security Review
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-security-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate canonical DEBO bootstrap
        run: python tools/debo_bootstrap_check.py
      - name: Run existing DEBO regression suite
        run: python -m unittest discover -s tests -p 'test_debo*.py' -v
      - name: Compile tracked Python source
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys
          files = subprocess.check_output(['git','ls-files','*.py'], text=True).splitlines()
          for file in files:
              compile(pathlib.Path(file).read_bytes(), file, 'exec')
          print(f'Compiled {len(files)} tracked Python files')
          PY

  synthetic-gemini-mcp:
    name: Gemini MCP synthetic transport (no provider calls)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and test isolated synthetic bridge
        working-directory: packages/debo-gemini-mcp
        env:
          DEBO_ENABLE_LIVE_GEMINI: 'false'
        run: |
          npm ci --ignore-scripts --offline --no-audit --no-fund
          npm run build
          npm test
