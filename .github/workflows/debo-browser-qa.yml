name: DEBO Browser Adapter QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'adapters/browser/**'
      - 'schemas/browser_workflow.schema.json'
      - 'fixtures/browser/**'
      - 'tests/browser/**'
      - 'scripts/browser_ci_receipt.py'
      - 'requirements-browser-qa.txt'
      - '.github/workflows/debo-browser-qa.yml'
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact reviewed PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install offline QA dependencies
        run: python -m pip install -r requirements-browser-qa.txt
      # No live browser execution here. Runtime sandbox/egress acceptance is a separate HOLD.
      - name: Execute offline QA
        id: qa
        run: PYTHONPATH=. python -m pytest tests/browser/ -v -rs --tb=short --junitxml=pytest-report.xml
      - name: Verify exact head, pytest exit status and zero-skip receipt
        if: always()
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          QA_OUTCOME: ${{ steps.qa.outcome }}
        run: PYTHONPATH=. python scripts/browser_ci_receipt.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-qa-receipt-${{ github.event.pull_request.head.sha }}
          path: ci-evidence-receipt.json
          if-no-files-found: error
          retention-days: 30
