name: DEBO Bootstrap Integrity
on:
  push:
    paths:
      - 'governance/**'
      - 'projects/dwing-exterior/DEBO_PROFILE_v2.md'
      - 'tools/debo_bootstrap_check.py'
      - 'tests/test_debo*.py'
      - 'schemas/debo_dashboard_snapshot_v0_3.schema.json'
      - 'tools/debo_dashboard_snapshot_validate.py'
      - 'SKILL_REGISTRY.md'
      - 'prompts/**'
      - 'skills/**'
      - 'projects/**/skills/**'
      - 'projects/**/AGENT_SYSTEM.md'
      - 'debo/policies/**'
      - 'tools/debo_agent_coverage_audit.py'
      - 'AGENTS.md'
      - 'DEBO_BOOTSTRAP.md'
      - 'PERPLEXITY_STARTER_PROMPT.md'
      - '.github/workflows/debo-bootstrap-check.yml'
  pull_request:
    paths:
      - 'governance/**'
      - 'projects/dwing-exterior/DEBO_PROFILE_v2.md'
      - 'tools/debo_bootstrap_check.py'
      - 'tests/test_debo*.py'
      - 'schemas/debo_dashboard_snapshot_v0_3.schema.json'
      - 'tools/debo_dashboard_snapshot_validate.py'
      - 'SKILL_REGISTRY.md'
      - 'prompts/**'
      - 'skills/**'
      - 'projects/**/skills/**'
      - 'projects/**/AGENT_SYSTEM.md'
      - 'debo/policies/**'
      - 'tools/debo_agent_coverage_audit.py'
      - 'AGENTS.md'
      - 'DEBO_BOOTSTRAP.md'
      - 'PERPLEXITY_STARTER_PROMPT.md'
      - '.github/workflows/debo-bootstrap-check.yml'
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate DEBO repository bootstrap
        run: python tools/debo_bootstrap_check.py
      - name: Test bootstrap and durable-save failure detection
        run: python -m unittest discover -s tests -p 'test_debo*.py' -v
      - name: Audit historical skill metadata (source-only, read-only)
        run: |
          python tools/debo_skill_delta.py --output /tmp/debo-skill-delta.json
          python -c 'import json; r=json.load(open("/tmp/debo-skill-delta.json")); print("GitHub-only DEBO skill audit:", r["summary"]); assert r["summary"]["github_catalog_rows"] == 72'
- name: Audit project skill sources and metadata contracts (source-only)
        run: |
          python tools/debo_skill_delta.py --include-projects --validate-contracts --output /tmp/debo-skill-source-contracts.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/debo-skill-source-contracts.json').read_text(encoding='utf-8'))
          summary = report['summary']
          contract = report['contract_audit']
          assert report['mode'] == 'READ_ONLY_LOCAL'
          assert summary['project_skill_sources'] > 0
          assert contract['checked'] > 0
          assert contract['checked'] == contract['pass'] + contract['needs_review']
          assert all(s['runtime_installed'] == 'UNVERIFIED' for s in report['skills'])
          print('Real project skills and Agent Skills contract audit:', {
              'github_catalog_rows': summary['github_catalog_rows'],
              'project_skill_sources': summary['project_skill_sources'],
              'contract_checked': contract['checked'],
              'contract_pass': contract['pass'],
              'contract_needs_review': contract['needs_review'],
          })
          if contract['needs_review']:
              print('Source-only metadata follow-up paths:', sorted(
                  item['source_path'] for item in contract['entries']
                  if item['status'] != 'PASS'))
          PY

