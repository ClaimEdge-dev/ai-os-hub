name: DEBO CI Security Baseline

on:
  pull_request:
  workflow_dispatch:
    inputs:
      codeql_language:
        description: "Optional CodeQL language (for example: javascript-typescript, python)"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      codeql_language:
        description: "Optional CodeQL language (for example: javascript-typescript, python)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  baseline:
    name: Repository hygiene and secret-safety checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate tracked JSON
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          files = subprocess.check_output(
              ["git", "ls-files", "*.json"], text=True
          ).splitlines()

          failures = []
          for name in files:
              path = pathlib.Path(name)
              try:
                  with path.open("r", encoding="utf-8") as f:
                      json.load(f)
              except Exception as exc:
                  failures.append((name, type(exc).__name__))

          if failures:
              for name, kind in failures:
                  print(f"Invalid JSON: {name} ({kind})")
              sys.exit(1)

          print(f"Validated {len(files)} tracked JSON file(s).")
          PY

      - name: Detect merge-conflict markers
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          import sys

          markers = ("<<<<<<<", "=======", ">>>>>>>")
          findings = []

          raw = subprocess.check_output(["git", "ls-files", "-z"])
          for item in raw.split(b"\0"):
              if not item:
                  continue
              path = pathlib.Path(item.decode("utf-8", errors="surrogateescape"))
              try:
                  if path.stat().st_size > 2_000_000:
                      continue
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              if all(marker in text for marker in markers):
                  findings.append(str(path))

          if findings:
              for path in findings:
                  print(f"Merge-conflict markers found: {path}")
              sys.exit(1)

          print("No unresolved merge-conflict marker sets found.")
          PY

      - name: Block tracked sensitive-file types
        shell: bash
        run: |
          python3 - <<'PY'
          import fnmatch
          import pathlib
          import subprocess
          import sys

          patterns = (
              ".env",
              ".env.*",
              "id_rsa",
              "id_ed25519",
              "*.pem",
              "*.p12",
              "*.pfx",
              "*.key",
          )
          allow = {".env.example", ".env.sample", ".env.template"}
          findings = []

          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          for name in files:
              base = pathlib.PurePosixPath(name).name
              if base in allow:
                  continue
              if any(fnmatch.fnmatch(base, pattern) for pattern in patterns):
                  findings.append(name)

          if findings:
              for path in findings:
                  print(f"Sensitive file type is tracked: {path}")
              sys.exit(1)

          print("No blocked sensitive-file types are tracked.")
          PY

      - name: High-confidence secret-pattern scan
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          # Never print a matched secret value. Report only file + pattern label.
          patterns = {
              "private-key-header": re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              "github-token": re.compile(r"\bgh[pousr]_[A-Za-z0-9]{30,}\b"),
              "aws-access-key": re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              "openai-project-key": re.compile(r"\bsk-proj-[A-Za-z0-9_-]{20,}\b"),
          }

          findings = []
          raw = subprocess.check_output(["git", "ls-files", "-z"])
          for item in raw.split(b"\0"):
              if not item:
                  continue
              path = pathlib.Path(item.decode("utf-8", errors="surrogateescape"))
              try:
                  if path.stat().st_size > 2_000_000:
                      continue
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              for label, pattern in patterns.items():
                  if pattern.search(text):
                      findings.append((str(path), label))

          if findings:
              for path, label in findings:
                  print(f"Potential secret detected: {path} [{label}]")
              print("Matched secret values were intentionally not printed.")
              sys.exit(1)

          print("No high-confidence secret patterns detected.")
          PY

  codeql:
    name: Optional CodeQL
    if: ${{ inputs.codeql_language != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ inputs.codeql_language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
