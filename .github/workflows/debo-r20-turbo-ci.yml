name: DEBO R20 Turbo Nonproduction CI
on:
  workflow_dispatch:
  push:
    branches:
      - debo-r18-source-preserving-sync-20261108
    paths:
      - 'neon/recovery/r20_turbo/**'
      - 'neon/recovery/r21_task_dashboard_offline_test.py'
      - 'neon/recovery/r25_source_mapping_offline_test.py'
      - 'tools/debo_r26_capsule_validator.py'
      - 'tools/test_debo_r26_capsule_validator.py'
      - 'tools/debo_r27_checkpoint_store.py'
      - 'tools/test_debo_r27_checkpoint_store.py'
      - 'tools/debo_r29_neon_adapter.py'
      - 'tools/test_debo_r29_neon_adapter.py'
      - 'tools/debo_r30_gate.py'
      - 'tools/test_debo_r30_gate.py'
      - 'governance/dashboard/r21_receipt_adapter.py'
      - 'governance/dashboard/test_r21_receipt_adapter.py'
      - 'governance/dashboard/r21_task_flow_acceptance.py'
      - 'governance/dashboard/test_r21_task_flow_acceptance.py'
      - 'governance/dashboard/R21_R20_EXECUTION_RECEIPTS_v1.json'
      - 'neon/recovery/DEBO_R31_15_TASK_MAPPING_REVIEW_2026-11-08.md'
      - '.github/workflows/debo-r20-turbo-ci.yml'
permissions:
  contents: read
jobs:
  r20-local-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run unit tests
        run: python -m unittest discover -s neon/recovery/r20_turbo -p 'test_*.py' -v
      - name: Run R21 task and dashboard offline acceptance
        run: python neon/recovery/r21_task_dashboard_offline_test.py
      - name: Run R21 dashboard receipt adapter acceptance
        run: python governance/dashboard/test_r21_receipt_adapter.py
      - name: Run R21 full offline task-to-dashboard acceptance
        run: python governance/dashboard/test_r21_task_flow_acceptance.py
      - name: Run R25 source fingerprint and mapping safety tests
        run: python neon/recovery/r25_source_mapping_offline_test.py
      - name: Run R26 continuity capsule validator tests
        run: python tools/test_debo_r26_capsule_validator.py
      - name: Run R27 checkpoint persistence and readback tests
        run: python tools/test_debo_r27_checkpoint_store.py
      - name: Run R29 Neon adapter offline acceptance tests
        run: python tools/test_debo_r29_neon_adapter.py
      - name: Run R30 live-readiness fail-closed acceptance
        run: python tools/test_debo_r30_gate.py
      - name: Run isolated smoke test
        run: python neon/recovery/r20_turbo/ci_smoke.py

# R20 CI verification request: nonproduction branch push trigger; no production jobs.
